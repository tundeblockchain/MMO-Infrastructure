openapi: 3.0.3
info:
  title: MMO Character API
  version: 0.3.0
  description: |
    MMO backend API for character management, authentication, and game metadata catalogs.
    
    **Authentication:**
    - Character endpoints use Firebase ID tokens or game session JWTs
    - Catalog write endpoints require Firebase ID tokens (admin only)
    - Catalog read endpoints are unauthenticated (for ZoneServer caching)
    
    **Catalog Read APIs (MMO-6, MMO-10):**
    GET endpoints for versioned game metadata catalogs. All reads are by explicit version.
    
    **Admin Entity Reads (MMO-10 / MMO-17):**
    Admin tools list and read catalog entities by pinned version:
    - `GET /catalog/versions/latest` - Get current version IDs for pinning
    - `GET /catalog/versions` - List all published versions for version selection
    - `GET /catalog/{catalogType}/v/{version}` - Read entities for a pinned version
    
    **Admin Catalog Publish Workflow (MMO-11 / MMO-18):**
    Admins use `POST /catalog/{catalogType}/versions` to publish new immutable catalog versions.
    Each call creates a new version with an auto-assigned version number.
    Published versions are immutable — there is no PATCH or update mechanism.
    
    To update catalog data:
    1. Prepare the complete new catalog data locally (e.g., from draft in mmo-admin)
    2. POST the full data to `/catalog/{catalogType}/versions` for each catalog type
    3. Each POST returns the newly allocated version number
    4. ZoneServer will pick up new versions on next boot via `/catalog/versions/latest`
    
    **Multi-type publish:** When releasing coordinated changes across multiple catalog types,
    make separate POST requests for each type. There is no atomic multi-type publish —
    version coordination is the responsibility of the admin tooling.
    
    **Entity Types:**
    - **class**: 6 playable classes with startingStats (ClassDefinition[])
    - **skill**: 48 skills with coefficients, timing, stagger (SkillDefinition[])
    - **status**: Buff/debuff/DoT/HoT effects (StatusDefinition[])
    - **element**: 8 damage types with strengths/weaknesses (ElementDefinition[])
    - **resonance**: 6 class synergy mechanics (ResonanceDefinition[])
    - **combat-constants**: Global combat math constants (CombatConstantsData object)
    
    **Data Conventions:**
    - Percents as decimals: 150% = 1.50, 15% = 0.15
    - Published versions are immutable
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables:
      apiId:
        default: example
      region:
        default: eu-west-2

tags:
  - name: auth
    description: Authentication and session management
  - name: characters
    description: Character creation, listing, and world entry
  - name: catalog
    description: Versioned game metadata catalogs

paths:
  /auth/session:
    post:
      tags: [auth]
      summary: Exchange Firebase ID token for game session JWT
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firebaseIdToken:
                  type: string
      responses:
        '200':
          description: Game session issued

  /characters:
    get:
      tags: [characters]
      summary: List characters for authenticated account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Character list
    post:
      tags: [characters]
      summary: Create a character
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: Character created

  /characters/{characterId}/enter:
    post:
      tags: [characters]
      summary: Enter world — returns scoped JWT and zone connection info
      security:
        - bearerAuth: []
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enter world payload

  /characters/{characterId}:
    put:
      tags: [characters]
      summary: Save character snapshot (ZoneServer internal)
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Internal-Api-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterRecord'
      responses:
        '200':
          description: Character saved

  /catalog/versions:
    get:
      tags: [catalog]
      summary: List all published catalog versions
      description: |
        Returns metadata for all published catalog versions across all catalog types.
        Useful for admin tools and debugging. Does not include the actual catalog data.
        
        **Admin Usage (MMO-17):**
        Admin tools use this endpoint to view version history across all catalog types.
        This helps admin:
        - See all available versions to choose from
        - Compare version history for auditing
        - Select an older version to read entities from
        
        **To read entity data:**
        After selecting a version, call `/catalog/{catalogType}/v/{version}` to get
        the full catalog with entity array in the `data` field.
      responses:
        '200':
          description: List of published versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogVersionList'
              example:
                versions:
                  - catalogType: class
                    version: 2
                    status: published
                    publishedAt: "2024-06-15T10:30:00.000Z"
                  - catalogType: class
                    version: 1
                    status: published
                    publishedAt: "2024-06-01T00:00:00.000Z"
                  - catalogType: combat-constants
                    version: 2
                    status: published
                    publishedAt: "2024-06-15T10:30:00.000Z"
                  - catalogType: combat-constants
                    version: 1
                    status: published
                    publishedAt: "2024-06-01T00:00:00.000Z"
                  - catalogType: skill
                    version: 1
                    status: published
                    publishedAt: "2024-06-01T00:00:00.000Z"
                  - catalogType: status
                    version: 1
                    status: published
                    publishedAt: "2024-06-01T00:00:00.000Z"
                  - catalogType: element
                    version: 1
                    status: published
                    publishedAt: "2024-06-01T00:00:00.000Z"
                  - catalogType: resonance
                    version: 1
                    status: published
                    publishedAt: "2024-06-01T00:00:00.000Z"

  /catalog/versions/latest:
    get:
      tags: [catalog]
      summary: Get latest published version for each catalog type
      description: |
        Returns the current highest published version number for each catalog type.
        ZoneServer calls this at boot to pin catalog versions for the session.
        
        **Admin Usage (MMO-17):**
        Admin tools call this endpoint to discover the current version numbers,
        then use `/catalog/{catalogType}/v/{version}` to read entities for a pinned version.
        
        **Workflow:**
        1. Call `/catalog/versions/latest` to get current version IDs
        2. Select/pin a version for each catalog type (admin may use latest or a specific version)
        3. Call `/catalog/{catalogType}/v/{version}` to list/read entities for that version
        
        **Note:** For combat-critical data, always read by explicit version - never rely on
        automatic "always-latest" behavior.
      responses:
        '200':
          description: Latest version numbers for each catalog type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestVersions'
              example:
                versions:
                  combat-constants: 3
                  class: 2
                  skill: 1
                  status: 1
                  element: 1
                  resonance: 1
                timestamp: "2024-06-15T10:30:00.000Z"

  /catalog/{catalogType}/v/{version}:
    get:
      tags: [catalog]
      summary: Get catalog data by type and version
      description: |
        Returns the full catalog data for a specific published version.
        Returns 404 if the version doesn't exist or is not published (draft versions are hidden).
        
        **Admin Usage (MMO-17):**
        Admin tools use this endpoint to list and read entities for a pinned catalog version.
        The `data` field contains the entity array (or object for combat-constants).
        
        **Entity Data Shapes:**
        - **class**: Array of ClassDefinition objects with startingStats
        - **skill**: Array of SkillDefinition objects with coefficients, timing, stagger, pvpMultipliers
        - **status**: Array of StatusDefinition objects (buff/debuff/dot/hot/control)
        - **element**: Array of ElementDefinition objects with strongAgainst/weakAgainst
        - **resonance**: Array of ResonanceDefinition objects with partyBonus
        - **combat-constants**: Single CombatConstantsData object with nested powerScaling, critical, defense, etc.
        
        **Immutability:**
        Published versions are immutable. Reads are always by explicit version - never "always-latest"
        for combat-critical data. Admin should pin a version and read entities from that version.
      parameters:
        - name: catalogType
          in: path
          required: true
          description: Type of catalog to retrieve
          schema:
            $ref: '#/components/schemas/CatalogType'
        - name: version
          in: path
          required: true
          description: Version number (must be a positive integer)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Catalog data with entity array/object in `data` field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogData'
              examples:
                classData:
                  summary: Class catalog (6 classes)
                  value:
                    catalogType: class
                    version: 1
                    status: published
                    createdAt: "2024-06-15T10:30:00.000Z"
                    publishedAt: "2024-06-15T10:30:00.000Z"
                    createdBy: firebase-uid-abc123
                    releaseNotes: Initial class definitions
                    data:
                      - classId: vanguard
                        displayName: Vanguard
                        description: A stalwart frontline defender who protects allies and controls the battlefield through sheer resilience and powerful melee strikes.
                        primaryResource: resolve
                        startingStats:
                          strength: 12
                          finesse: 7
                          vitality: 12
                          intellect: 4
                          precision: 6
                          luck: 5
                          tech: 4
                          hp: 150
                          resourcePool: 100
                          armor: 20
                          attackPower: 26
                          spellPower: 9
                          movementSpeed: 5.0
                        resonance: valor
                        roles: [tank, dps]
                      - classId: ranger
                        displayName: Ranger
                        description: A precise marksman who excels at ranged combat, using keen senses and deadly accuracy to eliminate targets from a distance.
                        primaryResource: focus
                        startingStats:
                          strength: 6
                          finesse: 11
                          vitality: 6
                          intellect: 4
                          precision: 13
                          luck: 7
                          tech: 3
                          hp: 100
                          resourcePool: 100
                          armor: 8
                          attackPower: 14
                          spellPower: 9
                          movementSpeed: 5.5
                        resonance: precision
                        roles: [dps]
                skillData:
                  summary: Skill catalog (48 skills - showing 1 example)
                  value:
                    catalogType: skill
                    version: 1
                    status: published
                    createdAt: "2024-06-15T10:30:00.000Z"
                    publishedAt: "2024-06-15T10:30:00.000Z"
                    createdBy: firebase-uid-abc123
                    releaseNotes: Initial skill definitions
                    data:
                      - skillId: vanguard_cleaving_strike
                        classId: vanguard
                        displayName: Cleaving Strike
                        description: "1.50 P + 0.60 STR, 120° arc. +8 Resolve per target; max +16."
                        kind: active
                        resourceId: null
                        resourceCost: 0
                        resourceEffects:
                          - resourceId: resolve
                            amount: 8
                            isPercentOfMax: false
                            perTargetBonus: 8
                        cooldownSeconds: 0
                        charges: 1
                        chargeRechargeSeconds: 0
                        castTimeSeconds: 0
                        castableWhileMoving: false
                        range: 0
                        coefficients:
                          basePower: 1.50
                          scaling:
                            - stat: attackPower
                              coefficient: 1.50
                            - stat: strength
                              coefficient: 0.60
                          element: physical
                        timing:
                          castMs: 0
                          activeMs: 350
                          recoveryMs: 300
                        stagger:
                          staggerPower: 20
                          canStagger: true
                        pvpMultipliers:
                          damageMultiplier: 0.90
                          resourceOverride:
                            resourceId: resolve
                            amount: 12
                        unlockLevel: 1
                        iconPath: icons/skills/vanguard/cleaving_strike.png
                combatConstantsData:
                  summary: Combat constants (single object)
                  value:
                    catalogType: combat-constants
                    version: 2
                    status: published
                    createdAt: "2024-06-15T10:30:00.000Z"
                    publishedAt: "2024-06-15T10:30:00.000Z"
                    createdBy: firebase-uid-abc123
                    releaseNotes: Combat constants v2 with ZoneServer keys
                    data:
                      powerScaling:
                        physicalPower:
                          strengthMultiplier: 2
                          levelMultiplier: 1.5
                        spellPower:
                          intellectMultiplier: 2
                          levelMultiplier: 1
                        techPower:
                          techMultiplier: 2
                          levelMultiplier: 1
                        devicePower:
                          techDivisor: 100
                      critical:
                        baseCritChance: 0.05
                        critChance:
                          luckConstant: 500
                          maxLuckCritBonus: 0.30
                        procChance:
                          luckDivisor: 500
                        criticalDamageMultiplier: 1.50
                      defense:
                        defenseConstant:
                          baseConstant: 200
                          levelMultiplier: 15
                        armorReductionPerPoint: 0.001
                        maxArmorReduction: 0.75
                        blockDamageReduction: 0.50
                      additionalConstants:
                        defaultAttackRange: 2.5
                        targetRange: 30
                statusData:
                  summary: Status catalog (showing 2 examples)
                  value:
                    catalogType: status
                    version: 1
                    status: published
                    createdAt: "2024-06-15T10:30:00.000Z"
                    publishedAt: "2024-06-15T10:30:00.000Z"
                    createdBy: firebase-uid-abc123
                    releaseNotes: Initial status definitions
                    data:
                      - statusId: flame
                        displayName: Flame
                        description: Burning from fire damage, taking damage over time.
                        category: dot
                        maxStacks: 3
                        dispellable: true
                        persistsThroughDeath: false
                        iconPath: icons/statuses/flame.png
                      - statusId: stealth
                        displayName: Stealth
                        description: Hidden from enemies, next attack deals bonus damage.
                        category: buff
                        maxStacks: 1
                        dispellable: false
                        persistsThroughDeath: false
                        iconPath: icons/statuses/stealth.png
                elementData:
                  summary: Element catalog (8 elements)
                  value:
                    catalogType: element
                    version: 1
                    status: published
                    createdAt: "2024-06-15T10:30:00.000Z"
                    publishedAt: "2024-06-15T10:30:00.000Z"
                    createdBy: firebase-uid-abc123
                    releaseNotes: Initial element definitions
                    data:
                      - elementId: fire
                        displayName: Fire
                        color: "#FF4500"
                        strongAgainst:
                          ice: 1.25
                          nature: 1.25
                        weakAgainst:
                          fire: 0.50
                      - elementId: ice
                        displayName: Ice
                        color: "#00BFFF"
                        strongAgainst:
                          lightning: 1.25
                          nature: 1.15
                        weakAgainst:
                          fire: 0.75
                          ice: 0.50
                resonanceData:
                  summary: Resonance catalog (6 resonances)
                  value:
                    catalogType: resonance
                    version: 1
                    status: published
                    createdAt: "2024-06-15T10:30:00.000Z"
                    publishedAt: "2024-06-15T10:30:00.000Z"
                    createdBy: firebase-uid-abc123
                    releaseNotes: Initial resonance definitions
                    data:
                      - resonanceId: valor
                        displayName: Valor
                        description: The resonance of the Vanguard. Party members gain increased health and damage resistance when valor is high.
                        partyBonus:
                          - stat: hp
                            bonusPercent: 0.10
                          - stat: armor
                            bonusPercent: 0.08
                      - resonanceId: precision
                        displayName: Precision
                        description: The resonance of the Ranger. Party members gain increased critical hit chance and accuracy when precision is focused.
                        partyBonus:
                          - stat: attackPower
                            bonusPercent: 0.06
                          - stat: movementSpeed
                            bonusPercent: 0.05
        '400':
          description: Invalid catalog type or version number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidType:
                  summary: Invalid catalog type
                  value:
                    error: "Invalid catalog type: weapons. Valid types: combat-constants, class, skill, status, element, resonance"
                invalidVersion:
                  summary: Invalid version
                  value:
                    error: "Version must be a positive integer"
        '404':
          description: Version not found or not published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Catalog class version 99 not found or not published"

  /catalog/{catalogType}/versions:
    post:
      tags: [catalog]
      summary: Publish a new catalog version
      description: |
        Creates and publishes a new version of the specified catalog type.
        
        **Authentication:** Requires a valid Firebase ID token.
        
        **Version allocation:** The next version number is automatically assigned.
        Published versions are immutable — you cannot modify them after creation.
        
        **Race conditions:** If two requests race to create the same version number,
        one will succeed and the other will receive a 409 Conflict. Retry the request
        to get the next available version.
      security:
        - firebaseAuth: []
      parameters:
        - name: catalogType
          in: path
          required: true
          description: Type of catalog to publish
          schema:
            $ref: '#/components/schemas/CatalogType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishCatalogRequest'
            examples:
              classData:
                summary: Publish class definitions (array of ClassDefinition)
                value:
                  data:
                    - classId: vanguard
                      displayName: Vanguard
                      description: A stalwart frontline defender who protects allies and controls the battlefield through sheer resilience and powerful melee strikes.
                      primaryResource: resolve
                      startingStats:
                        strength: 12
                        finesse: 7
                        vitality: 12
                        intellect: 4
                        precision: 6
                        luck: 5
                        tech: 4
                        hp: 150
                        resourcePool: 100
                        armor: 20
                        attackPower: 26
                        spellPower: 9
                        movementSpeed: 5.0
                      resonance: valor
                      roles: [tank, dps]
                    - classId: warden
                      displayName: Warden
                      description: A divine guardian who balances offensive judgment and protective radiance.
                      primaryResource: radiance
                      secondaryResource: judgement
                      startingStats:
                        strength: 5
                        finesse: 6
                        vitality: 10
                        intellect: 12
                        precision: 6
                        luck: 6
                        tech: 5
                        hp: 120
                        resourcePool: 100
                        armor: 12
                        attackPower: 12
                        spellPower: 25
                        movementSpeed: 5.0
                      resonance: sanctuary
                      roles: [healer, support]
                  releaseNotes: Initial class definitions with all 6 base classes
              combatConstants:
                summary: Publish combat constants (object with nested powerScaling)
                description: |
                  Combat constants use nested structure with percentages as decimals.
                  150% = 1.50, 15% = 0.15, 5% = 0.05
                value:
                  data:
                    powerScaling:
                      physicalPower:
                        strengthMultiplier: 2
                        levelMultiplier: 1.5
                      spellPower:
                        intellectMultiplier: 2
                        levelMultiplier: 1
                      techPower:
                        techMultiplier: 2
                        levelMultiplier: 1
                      devicePower:
                        techDivisor: 100
                    speed:
                      attackSpeed:
                        finesseConstant: 400
                        attackSpeedCap: 2.5
                      dodgeRecovery:
                        finesseConstant: 1000
                    vitality:
                      maxHp:
                        vitalityDivisor: 100
                      healingReceived:
                        vitalityDivisor: 1000
                    accuracy:
                      baseHitChance: 0.90
                      accuracyBonus:
                        precisionConstant: 300
                        maxAccuracyBonus: 0.15
                      weakPoint:
                        precisionMultiplier: 0.0015
                    critical:
                      baseCritChance: 0.05
                      critChance:
                        luckConstant: 500
                        maxLuckCritBonus: 0.30
                      procChance:
                        luckDivisor: 500
                      criticalDamageMultiplier: 1.50
                    defense:
                      defenseConstant:
                        baseConstant: 200
                        levelMultiplier: 15
                      armorReductionPerPoint: 0.001
                      maxArmorReduction: 0.75
                      blockDamageReduction: 0.50
                    glancingHit:
                      damageMultiplier: 0.50
                      canCrit: false
                      canStagger: false
                    status:
                      resistanceConstant: 100
                    statAllocationBands:
                      - { minLevel: 1, maxLevel: 10, pointsPerLevel: 2, allocationCostPerPoint: 1 }
                      - { minLevel: 11, maxLevel: 30, pointsPerLevel: 3, allocationCostPerPoint: 1 }
                    statCaps:
                      softCap: 100
                      hardCap: 150
                      softCapPenalty: 0.50
                    dodge:
                      baseDodgeChance: 0.02
                      maxDodgeChance: 0.40
                    timing:
                      globalCooldown: 1.5
                      outOfCombatHpRegen: 0.05
                      outOfCombatResourceRegen: 0.10
                      combatDropoffSeconds: 10
                    stagger:
                      baseStaggerThreshold: 100
                      staggerRecoveryRate: 10
                      staggerDurationSeconds: 2
                      staggerImmunitySeconds: 3
                    pvp:
                      globalDamageMultiplier: 0.60
                      globalHealingMultiplier: 0.70
                      ccDurationMultiplier: 0.50
                      executeThresholdModifier: -0.10
                    additionalConstants:
                      defaultAttackRange: 2.5
                      targetRange: 30
                      defaultAttackDamage: 10
                      aoiRadius: 30
                  releaseNotes: Combat constants v2 with ZoneServer defaults
              skillData:
                summary: Publish skill definitions (array of SkillDefinition)
                description: |
                  Skills include timing in ms, stagger coefficients, and PvP multipliers.
                  All 8 skills per class, 48 total.
                value:
                  data:
                    - skillId: vanguard_cleaving_strike
                      classId: vanguard
                      displayName: Cleaving Strike
                      description: "1.50 P + 0.60 STR, 120° arc. +8 Resolve per target; max +16."
                      kind: active
                      resourceId: null
                      resourceCost: 0
                      resourceEffects:
                        - { resourceId: resolve, amount: 8, isPercentOfMax: false, perTargetBonus: 8 }
                      cooldownSeconds: 0
                      charges: 1
                      chargeRechargeSeconds: 0
                      castTimeSeconds: 0
                      castableWhileMoving: false
                      range: 0
                      coefficients:
                        basePower: 1.50
                        scaling:
                          - { stat: attackPower, coefficient: 1.50 }
                          - { stat: strength, coefficient: 0.60 }
                        element: physical
                      timing: { castMs: 0, activeMs: 350, recoveryMs: 300 }
                      stagger: { staggerPower: 20, canStagger: true }
                      pvpMultipliers:
                        damageMultiplier: 0.90
                        resourceOverride: { resourceId: resolve, amount: 12 }
                      unlockLevel: 1
                      iconPath: icons/skills/vanguard/cleaving_strike.png
                  releaseNotes: Initial skill definitions with full timing and PvP data
              statusData:
                summary: Publish status effect definitions (array of StatusDefinition)
                value:
                  data:
                    - statusId: flame
                      displayName: Flame
                      description: Burning from fire damage, taking damage over time.
                      category: dot
                      maxStacks: 3
                      dispellable: true
                      persistsThroughDeath: false
                      iconPath: icons/statuses/flame.png
                    - statusId: stagger
                      displayName: Stagger
                      description: Staggered, briefly unable to act.
                      category: control
                      maxStacks: 1
                      dispellable: false
                      persistsThroughDeath: false
                      iconPath: icons/statuses/stagger.png
                  releaseNotes: Status effects for DoT, control, debuff, and buff categories
              elementData:
                summary: Publish element definitions (array of ElementDefinition)
                description: |
                  Element affinities use decimals: 1.25 = 25% bonus, 0.75 = 25% reduced.
                value:
                  data:
                    - elementId: fire
                      displayName: Fire
                      color: "#FF4500"
                      strongAgainst: { ice: 1.25, nature: 1.25 }
                      weakAgainst: { fire: 0.50 }
                    - elementId: ice
                      displayName: Ice
                      color: "#00BFFF"
                      strongAgainst: { lightning: 1.25, nature: 1.15 }
                      weakAgainst: { fire: 0.75, ice: 0.50 }
                  releaseNotes: 8 damage elements with affinity relationships
              resonanceData:
                summary: Publish resonance definitions (array of ResonanceDefinition)
                description: |
                  Resonance bonuses use decimals: 0.10 = 10% bonus.
                value:
                  data:
                    - resonanceId: valor
                      displayName: Valor
                      description: The resonance of the Vanguard. Party members gain increased health and damage resistance.
                      partyBonus:
                        - { stat: hp, bonusPercent: 0.10 }
                        - { stat: armor, bonusPercent: 0.08 }
                    - resonanceId: arcana
                      displayName: Arcana
                      description: The resonance of the Arcanist. Party members gain increased spell power.
                      partyBonus:
                        - { stat: spellPower, bonusPercent: 0.10 }
                        - { stat: resourcePool, bonusPercent: 0.05 }
                  releaseNotes: 6 resonance types for class synergies
      responses:
        '201':
          description: Catalog version published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCatalogResponse'
              example:
                catalogType: class
                version: 2
                status: published
                createdAt: "2024-06-16T08:00:00.000Z"
                publishedAt: "2024-06-16T08:00:00.000Z"
                createdBy: firebase-uid-abc123
                releaseNotes: Updated class starting stats
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidType:
                  summary: Invalid catalog type
                  value:
                    error: "Invalid catalog type: weapons. Valid types: combat-constants, class, skill, status, element, resonance"
                invalidJson:
                  summary: Invalid JSON body
                  value:
                    error: "Request body must be valid JSON"
                missingData:
                  summary: Missing data field
                  value:
                    error: "Catalog data is required"
                wrongFormat:
                  summary: Wrong data format
                  value:
                    error: "class data must be an array"
        '401':
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Valid Firebase ID token required"
        '409':
          description: Version conflict (race condition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Version 3 already exists for class. Retry to allocate a new version."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Game session JWT or Firebase ID token
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token (required for catalog writes)

  schemas:
    CatalogType:
      type: string
      enum:
        - combat-constants
        - class
        - skill
        - status
        - element
        - resonance
      description: |
        Type of game metadata catalog:
        - **combat-constants**: Global damage formulas and scaling factors (object)
        - **class**: Playable class definitions (array)
        - **skill**: Skill definitions with damage, costs, cooldowns (array)
        - **status**: Buff/debuff effect definitions (array)
        - **element**: Elemental damage types (array)
        - **resonance**: Class synergy mechanics (array)

    CatalogVersionSummary:
      type: object
      required:
        - catalogType
        - version
        - status
      properties:
        catalogType:
          $ref: '#/components/schemas/CatalogType'
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [published]
        publishedAt:
          type: string
          format: date-time

    CatalogVersionList:
      type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/CatalogVersionSummary'

    LatestVersions:
      type: object
      required:
        - versions
        - timestamp
      properties:
        versions:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: Map of catalog type to latest published version number
        timestamp:
          type: string
          format: date-time
          description: Server timestamp when versions were retrieved

    CatalogData:
      type: object
      description: |
        Complete catalog data returned from GET requests.
        The `data` field structure depends on the catalogType.
      required:
        - catalogType
        - version
        - status
        - createdAt
        - createdBy
        - data
      properties:
        catalogType:
          $ref: '#/components/schemas/CatalogType'
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [published]
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Firebase UID of the user who published this version
        releaseNotes:
          type: string
          description: Optional description of changes in this version
        data:
          oneOf:
            - $ref: '#/components/schemas/CombatConstantsData'
            - type: array
              items:
                $ref: '#/components/schemas/ClassDefinition'
            - type: array
              items:
                $ref: '#/components/schemas/SkillDefinition'
            - type: array
              items:
                $ref: '#/components/schemas/StatusDefinition'
            - type: array
              items:
                $ref: '#/components/schemas/ElementDefinition'
            - type: array
              items:
                $ref: '#/components/schemas/ResonanceDefinition'
          description: |
            Catalog data. Structure depends on catalogType:
            - **combat-constants**: CombatConstantsData object
            - **class**: Array of ClassDefinition
            - **skill**: Array of SkillDefinition
            - **status**: Array of StatusDefinition
            - **element**: Array of ElementDefinition
            - **resonance**: Array of ResonanceDefinition

    PublishCatalogRequest:
      type: object
      description: |
        Request body for publishing a new catalog version.
        The `data` field structure depends on the catalog type being published.
      required:
        - data
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/CombatConstantsData'
            - type: array
              items:
                $ref: '#/components/schemas/ClassDefinition'
              description: Array of ClassDefinition for class catalog
            - type: array
              items:
                $ref: '#/components/schemas/SkillDefinition'
              description: Array of SkillDefinition for skill catalog
            - type: array
              items:
                $ref: '#/components/schemas/StatusDefinition'
              description: Array of StatusDefinition for status catalog
            - type: array
              items:
                $ref: '#/components/schemas/ElementDefinition'
              description: Array of ElementDefinition for element catalog
            - type: array
              items:
                $ref: '#/components/schemas/ResonanceDefinition'
              description: Array of ResonanceDefinition for resonance catalog
          description: |
            Catalog data payload. Structure depends on catalogType:
            - **combat-constants**: CombatConstantsData object with nested powerScaling, critical, etc.
            - **class**: Array of ClassDefinition with startingStats
            - **skill**: Array of SkillDefinition with timing, stagger, pvpMultipliers
            - **status**: Array of StatusDefinition
            - **element**: Array of ElementDefinition with strongAgainst/weakAgainst
            - **resonance**: Array of ResonanceDefinition with partyBonus
        releaseNotes:
          type: string
          description: Optional description of changes in this version
          example: Initial release with all base classes

    PublishedCatalogResponse:
      type: object
      required:
        - catalogType
        - version
        - status
        - createdAt
        - publishedAt
        - createdBy
      properties:
        catalogType:
          $ref: '#/components/schemas/CatalogType'
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [published]
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Firebase UID of the user who published this version
        releaseNotes:
          type: string
          description: Optional description of changes

    CharacterRecord:
      type: object
      required:
        - accountId
        - characterId
      properties:
        accountId:
          type: string
        characterId:
          type: string
        name:
          type: string
        level:
          type: integer
        xp:
          type: integer
        money:
          type: integer
        hp:
          type: number
        maxHp:
          type: number
        sp:
          type: number
        maxSp:
          type: number
        zoneId:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message

    # =========================================================================
    # Entity Schemas - MMO-10 / MMO-11
    # Detailed schemas for each catalog entity type.
    # Admin (MMO-17) uses these to list and read entities by pinned version.
    # Admin (MMO-18) uses these to publish new catalog versions.
    # All percentages stored as decimals: 150% = 1.50, 15% = 0.15, 5% = 0.05
    # =========================================================================

    PrimaryStats:
      type: object
      description: Seven primary stats for character builds
      required:
        - strength
        - finesse
        - vitality
        - intellect
        - precision
        - luck
        - tech
      properties:
        strength:
          type: number
          description: Physical damage scaling
          example: 12
        finesse:
          type: number
          description: Attack speed, dodge recovery
          example: 7
        vitality:
          type: number
          description: Max HP, healing received
          example: 12
        intellect:
          type: number
          description: Spell power scaling
          example: 4
        precision:
          type: number
          description: Hit chance, weak point chance
          example: 6
        luck:
          type: number
          description: Crit chance, proc chance
          example: 5
        tech:
          type: number
          description: Tech/device power scaling
          example: 4

    ClassStartingStats:
      allOf:
        - $ref: '#/components/schemas/PrimaryStats'
        - type: object
          required:
            - hp
            - resourcePool
            - armor
            - attackPower
            - spellPower
            - movementSpeed
          properties:
            hp:
              type: number
              description: Base health points
              example: 150
            resourcePool:
              type: number
              description: Base resource pool size
              example: 100
            armor:
              type: number
              description: Base armor value
              example: 20
            attackPower:
              type: number
              description: Base attack power (derived, stored for reference)
              example: 26
            spellPower:
              type: number
              description: Base spell power (derived, stored for reference)
              example: 9
            movementSpeed:
              type: number
              description: Base movement speed (units per second)
              example: 5.0

    ClassDefinition:
      type: object
      description: Playable class definition with starting stats
      required:
        - classId
        - displayName
        - description
        - primaryResource
        - startingStats
        - resonance
        - roles
      properties:
        classId:
          type: string
          enum: [vanguard, ranger, arcanist, machinist, warden, shade]
          description: Unique class identifier
          example: vanguard
        displayName:
          type: string
          description: Display name for the class
          example: Vanguard
        description:
          type: string
          description: Class description
          example: A stalwart frontline defender who protects allies and controls the battlefield.
        primaryResource:
          type: string
          enum: [resolve, focus, mana, charge, radiance, momentum]
          description: Primary resource used by this class
          example: resolve
        secondaryResource:
          type: string
          enum: [judgement]
          description: Secondary resource (if any, e.g., judgement for Warden)
          example: judgement
        startingStats:
          $ref: '#/components/schemas/ClassStartingStats'
        resonance:
          type: string
          enum: [valor, precision, arcana, innovation, sanctuary, subterfuge]
          description: Associated resonance type
          example: valor
        roles:
          type: array
          items:
            type: string
            enum: [tank, healer, dps, support]
          description: Role tags for matchmaking/UI
          example: [tank, dps]

    ScalingVector:
      type: object
      description: Stat scaling coefficient for damage/healing calculations
      required:
        - stat
        - coefficient
      properties:
        stat:
          type: string
          enum:
            - attackPower
            - spellPower
            - techPower
            - devicePower
            - healingPower
            - maxHp
            - missingHp
            - missingHpPercent
            - armor
            - level
            - strength
            - finesse
            - vitality
            - intellect
            - precision
            - luck
            - tech
          description: Stat that contributes to scaling
          example: attackPower
        coefficient:
          type: number
          description: Coefficient for this stat (e.g., 0.5 = 50% of stat value)
          example: 1.50

    SkillTiming:
      type: object
      description: Skill timing in milliseconds for precise combat sync
      required:
        - castMs
        - activeMs
        - recoveryMs
      properties:
        castMs:
          type: integer
          description: Cast/windup time before skill activates (ms)
          example: 0
        activeMs:
          type: integer
          description: Active/execution time of the skill (ms)
          example: 350
        recoveryMs:
          type: integer
          description: Recovery/backswing time after skill completes (ms)
          example: 300
        activePhaseType:
          type: string
          enum: [standard, hold, stance, reaction, deploy, buff, summon, channel]
          description: Type of active phase for special behaviors
          example: standard

    StaggerCoefficients:
      type: object
      description: Stagger mechanics for a skill
      required:
        - staggerPower
        - canStagger
      properties:
        staggerPower:
          type: number
          description: Base stagger value dealt
          example: 20
        staggerResist:
          type: number
          description: Stagger resistance granted during skill (0-1)
          example: 0.50
        canStagger:
          type: boolean
          description: Whether this skill can stagger on hit
          example: true
        perStackStagger:
          type: number
          description: Per-stack stagger values for stack-based skills
          example: 15
        staggerPerHit:
          type: number
          description: Stagger per hit for multi-hit skills
          example: 5
        bonusStagger:
          type: object
          properties:
            condition:
              type: string
              example: perfect_timing
            value:
              type: number
              example: 70
        statusBuildup:
          type: object
          properties:
            status:
              type: string
              example: armor_break
            value:
              type: number
              example: 35

    PvPMultipliers:
      type: object
      description: PvP balance multipliers (all as decimals, 1.0 = no change)
      properties:
        damageMultiplier:
          type: number
          description: Damage multiplier in PvP
          example: 0.90
        healingMultiplier:
          type: number
          description: Healing multiplier in PvP
          example: 0.80
        durationMultiplier:
          type: number
          description: Duration multiplier for effects in PvP
        durationSeconds:
          type: number
          description: Duration override in seconds for PvP
          example: 4
        cooldownMultiplier:
          type: number
          description: Cooldown multiplier in PvP
        cooldownSeconds:
          type: number
          description: Cooldown override in seconds for PvP
        staggerMultiplier:
          type: number
          description: Stagger multiplier in PvP
          example: 0.70
        resourceOverride:
          type: object
          properties:
            resourceId:
              type: string
            amount:
              type: number
          example: { resourceId: resolve, amount: 12 }
        maxTargets:
          type: integer
          description: Max targets override for PvP
          example: 3
        maxHitsPerTarget:
          type: integer
          description: Max hits per target override for PvP
        effectOverrides:
          type: object
          additionalProperties:
            type: number
          description: Effect value overrides
          example: { blockReduction: 0.50, critBonus: 0.10 }

    ResourceEffect:
      type: object
      description: Resource generation or consumption configuration
      required:
        - resourceId
        - amount
        - isPercentOfMax
      properties:
        resourceId:
          type: string
          description: Resource type affected
          example: resolve
        amount:
          type: number
          description: Amount (positive = generate, negative = consume)
          example: 8
        isPercentOfMax:
          type: boolean
          description: If true, amount is % of max resource (0.10 = 10%)
          example: false
        perTargetBonus:
          type: number
          description: Per-target bonus for AoE skills
          example: 8

    SkillCoefficients:
      type: object
      description: Damage/healing coefficients and scaling
      required:
        - basePower
        - scaling
      properties:
        basePower:
          type: number
          description: Base damage/healing amount (power coefficient)
          example: 1.50
        scaling:
          type: array
          items:
            $ref: '#/components/schemas/ScalingVector'
          description: Scaling vectors for damage calculation
        element:
          type: string
          enum: [physical, fire, ice, lightning, arcane, nature, shadow, radiant]
          description: Element type for damage skills
          example: physical
        appliesStatus:
          type: string
          description: Status effect applied on hit
          example: armor_break
        effectDuration:
          type: number
          description: Duration of applied effect in seconds
          example: 6
        perStack:
          type: object
          description: Per-stack coefficient progression (e.g., Sever momentum stacks)
          properties:
            basePowerPerStack:
              type: array
              items:
                type: number
              description: Per-stack base power values (index 0 = 1 stack)
              example: [1.50, 2.00, 2.60, 3.30, 4.20]
        conditionals:
          type: array
          items:
            type: object
            properties:
              condition:
                type: string
                enum: [marked, below_hp_threshold, above_hp_threshold, perfect_timing, flanking, stealthed, boss_target]
              threshold:
                type: number
                description: Threshold value for HP conditions (as decimal)
              basePower:
                type: number
              damageMultiplier:
                type: number
          description: Conditional coefficient modifiers

    SkillDefinition:
      type: object
      description: Complete skill definition with coefficients and timing
      required:
        - skillId
        - classId
        - displayName
        - description
        - kind
        - resourceId
        - resourceCost
        - cooldownSeconds
        - charges
        - chargeRechargeSeconds
        - castTimeSeconds
        - castableWhileMoving
        - range
        - coefficients
        - unlockLevel
        - iconPath
      properties:
        skillId:
          type: string
          description: Stable skill identifier
          example: vanguard_cleaving_strike
        classId:
          type: string
          enum: [vanguard, ranger, arcanist, machinist, warden, shade]
          description: Class this skill belongs to
          example: vanguard
        displayName:
          type: string
          example: Cleaving Strike
        description:
          type: string
          example: "1.50 P + 0.60 STR, 120° arc. +8 Resolve per target; max +16."
        kind:
          type: string
          enum: [active, passive, reaction]
          description: Activation type
          example: active
        resourceId:
          type: string
          nullable: true
          description: Resource consumed (null for no cost)
          example: null
        resourceCost:
          type: number
          description: Resource cost amount
          example: 0
        resourceEffects:
          type: array
          items:
            $ref: '#/components/schemas/ResourceEffect'
          description: Resource generation and consumption effects
        cooldownSeconds:
          type: number
          description: Cooldown in seconds (0 for no cooldown)
          example: 0
        internalCooldownSeconds:
          type: number
          description: Internal cooldown per target in seconds
        charges:
          type: integer
          description: Maximum charges
          example: 1
        chargeRechargeSeconds:
          type: number
          example: 0
        castTimeSeconds:
          type: number
          example: 0
        castableWhileMoving:
          type: boolean
          example: false
        range:
          type: number
          description: Range in units (0 for melee/self)
          example: 0
        coefficients:
          $ref: '#/components/schemas/SkillCoefficients'
        timing:
          $ref: '#/components/schemas/SkillTiming'
        stagger:
          $ref: '#/components/schemas/StaggerCoefficients'
        pvpMultipliers:
          $ref: '#/components/schemas/PvPMultipliers'
        antiDeathDurationSeconds:
          type: number
        exhaustedDurationSeconds:
          type: number
        unlockLevel:
          type: integer
          example: 1
        iconPath:
          type: string
          example: icons/skills/vanguard/cleaving_strike.png

    StatusDefinition:
      type: object
      description: Status effect definition (buff, debuff, DoT, HoT)
      required:
        - statusId
        - displayName
        - description
        - category
        - maxStacks
        - dispellable
        - persistsThroughDeath
        - iconPath
      properties:
        statusId:
          type: string
          description: Unique status identifier
          example: flame
        displayName:
          type: string
          example: Flame
        description:
          type: string
          example: Burning from fire damage, taking damage over time.
        category:
          type: string
          enum: [buff, debuff, dot, hot, control]
          description: Category of effect
          example: dot
        maxStacks:
          type: integer
          description: Maximum stacks
          example: 3
        dispellable:
          type: boolean
          example: true
        persistsThroughDeath:
          type: boolean
          example: false
        iconPath:
          type: string
          example: icons/statuses/flame.png

    ElementDefinition:
      type: object
      description: Elemental damage type with strengths/weaknesses
      required:
        - elementId
        - displayName
        - color
        - strongAgainst
        - weakAgainst
      properties:
        elementId:
          type: string
          enum: [physical, fire, ice, lightning, arcane, nature, shadow, radiant]
          description: Element identifier
          example: fire
        displayName:
          type: string
          example: Fire
        color:
          type: string
          description: Color hex code for UI
          example: "#FF4500"
        strongAgainst:
          type: object
          additionalProperties:
            type: number
          description: Elements this is strong against (1.25 = 25% bonus damage)
          example: { ice: 1.25, nature: 1.25 }
        weakAgainst:
          type: object
          additionalProperties:
            type: number
          description: Elements this is weak against (0.75 = 25% reduced damage)
          example: { fire: 0.50 }

    ResonanceDefinition:
      type: object
      description: Class resonance synergy mechanics
      required:
        - resonanceId
        - displayName
        - description
        - partyBonus
      properties:
        resonanceId:
          type: string
          enum: [valor, precision, arcana, innovation, sanctuary, subterfuge]
          description: Resonance identifier
          example: valor
        displayName:
          type: string
          example: Valor
        description:
          type: string
          example: The resonance of the Vanguard. Party members gain increased health and damage resistance.
        partyBonus:
          type: array
          items:
            type: object
            required:
              - stat
              - bonusPercent
            properties:
              stat:
                type: string
                description: Stat affected
                example: hp
              bonusPercent:
                type: number
                description: Bonus percent as decimal (0.10 = 10%)
                example: 0.10
          description: Stat bonuses when party members share resonance
          example:
            - { stat: hp, bonusPercent: 0.10 }
            - { stat: armor, bonusPercent: 0.08 }

    # =========================================================================
    # Combat Constants Schema - MMO-10 / MMO-11
    # All percentages stored as decimals: 150% = 1.50, 15% = 0.15, 5% = 0.05
    # =========================================================================

    PowerScalingConstants:
      type: object
      description: Power scaling coefficients for derived stat calculations
      required:
        - physicalPower
        - spellPower
        - techPower
        - devicePower
      properties:
        physicalPower:
          type: object
          description: "PhysicalPower = Strength * strengthMultiplier + Level * levelMultiplier"
          required:
            - strengthMultiplier
            - levelMultiplier
          properties:
            strengthMultiplier:
              type: number
              example: 2
            levelMultiplier:
              type: number
              example: 1.5
        spellPower:
          type: object
          description: "SpellPower = Intellect * intellectMultiplier + Level * levelMultiplier"
          required:
            - intellectMultiplier
            - levelMultiplier
          properties:
            intellectMultiplier:
              type: number
              example: 2
            levelMultiplier:
              type: number
              example: 1
        techPower:
          type: object
          description: "TechPower = Tech * techMultiplier + Level * levelMultiplier"
          required:
            - techMultiplier
            - levelMultiplier
          properties:
            techMultiplier:
              type: number
              example: 2
            levelMultiplier:
              type: number
              example: 1
        devicePower:
          type: object
          description: "DevicePower = Tech / techDivisor"
          required:
            - techDivisor
          properties:
            techDivisor:
              type: number
              example: 100

    CombatConstantsData:
      type: object
      description: |
        Complete combat constants catalog (object, not array).
        All percentages stored as decimals (150% = 1.50, 15% = 0.15).
      required:
        - powerScaling
        - critical
        - defense
      properties:
        powerScaling:
          $ref: '#/components/schemas/PowerScalingConstants'
        speed:
          type: object
          properties:
            attackSpeed:
              type: object
              properties:
                finesseConstant:
                  type: number
                  example: 400
                attackSpeedCap:
                  type: number
                  example: 2.5
            dodgeRecovery:
              type: object
              properties:
                finesseConstant:
                  type: number
                  example: 1000
        vitality:
          type: object
          properties:
            maxHp:
              type: object
              properties:
                vitalityDivisor:
                  type: number
                  example: 100
            healingReceived:
              type: object
              properties:
                vitalityDivisor:
                  type: number
                  example: 1000
        accuracy:
          type: object
          properties:
            baseHitChance:
              type: number
              description: "Base hit chance as decimal (0.90 = 90%)"
              example: 0.90
            accuracyBonus:
              type: object
              properties:
                precisionConstant:
                  type: number
                  example: 300
                maxAccuracyBonus:
                  type: number
                  description: "Max bonus as decimal (0.15 = 15%)"
                  example: 0.15
            weakPoint:
              type: object
              properties:
                precisionMultiplier:
                  type: number
                  example: 0.0015
        critical:
          type: object
          description: Critical hit and proc chance formulas
          required:
            - baseCritChance
            - critChance
            - procChance
            - criticalDamageMultiplier
          properties:
            baseCritChance:
              type: number
              description: Base critical hit chance (decimal, 0.05 = 5%)
              example: 0.05
            critChance:
              type: object
              properties:
                luckConstant:
                  type: number
                  example: 500
                maxLuckCritBonus:
                  type: number
                  description: "Max luck crit bonus as decimal (0.30 = 30%)"
                  example: 0.30
            procChance:
              type: object
              properties:
                luckDivisor:
                  type: number
                  example: 500
            criticalDamageMultiplier:
              type: number
              description: Critical damage multiplier (1.50 = 150% damage)
              example: 1.50
        defense:
          type: object
          description: Defense calculation constants
          required:
            - defenseConstant
            - armorReductionPerPoint
            - maxArmorReduction
            - blockDamageReduction
          properties:
            defenseConstant:
              type: object
              properties:
                baseConstant:
                  type: number
                  example: 200
                levelMultiplier:
                  type: number
                  example: 15
            armorReductionPerPoint:
              type: number
              description: Armor reduction per point (decimal, 0.001)
              example: 0.001
            maxArmorReduction:
              type: number
              description: Maximum armor reduction (decimal, 0.75 = 75%)
              example: 0.75
            blockDamageReduction:
              type: number
              description: Block damage reduction (decimal, 0.50 = 50%)
              example: 0.50
        glancingHit:
          type: object
          properties:
            damageMultiplier:
              type: number
              description: "Glancing hit damage as decimal (0.50 = 50%)"
              example: 0.50
            canCrit:
              type: boolean
              example: false
            canStagger:
              type: boolean
              example: false
        status:
          type: object
          properties:
            resistanceConstant:
              type: number
              example: 100
        statAllocationBands:
          type: array
          items:
            type: object
            properties:
              minLevel:
                type: integer
              maxLevel:
                type: integer
              pointsPerLevel:
                type: integer
              allocationCostPerPoint:
                type: integer
          example:
            - { minLevel: 1, maxLevel: 10, pointsPerLevel: 2, allocationCostPerPoint: 1 }
            - { minLevel: 11, maxLevel: 30, pointsPerLevel: 3, allocationCostPerPoint: 1 }
        statCaps:
          type: object
          properties:
            softCap:
              type: integer
              example: 100
            hardCap:
              type: integer
              example: 150
            softCapPenalty:
              type: number
              description: "Penalty as decimal (0.50 = 50%)"
              example: 0.50
        dodge:
          type: object
          properties:
            baseDodgeChance:
              type: number
              description: "Base dodge chance as decimal (0.02 = 2%)"
              example: 0.02
            maxDodgeChance:
              type: number
              description: "Max dodge chance as decimal (0.40 = 40%)"
              example: 0.40
        timing:
          type: object
          properties:
            globalCooldown:
              type: number
              description: GCD in seconds
              example: 1.5
            outOfCombatHpRegen:
              type: number
              description: "HP regen rate as decimal (0.05 = 5% per tick)"
              example: 0.05
            outOfCombatResourceRegen:
              type: number
              description: "Resource regen rate as decimal (0.10 = 10% per tick)"
              example: 0.10
            combatDropoffSeconds:
              type: number
              example: 10
        stagger:
          type: object
          properties:
            baseStaggerThreshold:
              type: number
              example: 100
            staggerRecoveryRate:
              type: number
              example: 10
            staggerDurationSeconds:
              type: number
              example: 2
            staggerImmunitySeconds:
              type: number
              example: 3
        pvp:
          type: object
          properties:
            globalDamageMultiplier:
              type: number
              description: "Global PvP damage reduction as decimal (0.60 = 60%)"
              example: 0.60
            globalHealingMultiplier:
              type: number
              description: "Global PvP healing reduction as decimal (0.70 = 70%)"
              example: 0.70
            ccDurationMultiplier:
              type: number
              description: "CC duration multiplier as decimal (0.50 = 50%)"
              example: 0.50
            executeThresholdModifier:
              type: number
              description: "Execute threshold modifier (additive, -0.10 = -10%)"
              example: -0.10
        additionalConstants:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: boolean
              - type: string
          description: Extensible map for additional constants (ZoneServer defaults, etc.)
          example:
            defaultAttackRange: 2.5
            targetRange: 30
            defaultAttackDamage: 10
            aoiRadius: 30
