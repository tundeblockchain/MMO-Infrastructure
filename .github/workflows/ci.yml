name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: CDK Synth (no deploy)
        run: |
          npx cdk synth \
            -c githubConnectionArn=arn:aws:codestar-connections:eu-west-2:123456789012:connection/dummy \
            -c githubOwner=dummy-owner \
            -c githubRepo=dummy-repo
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: 'eu-west-2'
